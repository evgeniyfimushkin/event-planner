name: build and push frontend service

on:
  push:
    branches:
      - frontend

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend

    steps:
      - name: checkout repository
        uses: actions/checkout@v2

      - name: Build docker image for ${{ matrix.service }}
        run: |
          docker build -t evgeniyfimushkin/${{ matrix.service }}:latest services/${{ matrix.service }}

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push docker image for ${{ matrix.service }}
        run: docker push evgeniyfimushkin/${{ matrix.service }}:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start application containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd event-planner
            rm .env
            export ENV=prod
            echo "${{ secrets.PUBLIC_KEY }}" > public_key.pem
            echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
            export PUBLIC_KEY=$(cat public_key.pem)
            export PRIVATE_KEY=$(cat private_key.pem)
            export POSTGRES_HOST=db
            export POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export TZ=$(timedatectl | grep "Time zone" | awk '{print $3}')
            cp public_key.pem nginx/jwt_public_key.pem
            docker ps | awk '{system("docker rmi "$3)}'
            docker system prune -af
            docker-compose pull
            docker-compose down
            docker-compose up -d